<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Produk — Tani Cihawuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="role-admin">
<div class="admin-page">
  <div class="admin-layout">
    <div id="dash-sidebar-mount"></div>
    <div class="admin-main">
      <div id="dash-topbar-mount"></div>
      <main class="admin-content">
        <div class="admin-page-header"><div><h1>Kelola Produk</h1><p>Seluruh produk dari semua produsen.</p></div></div>

        <div class="admin-card">
          <div class="data-toolbar" style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between;align-items:center;">
            <div style="flex:1;min-width:240px;max-width:400px;">
              <input type="text" id="search-input" placeholder="Cari nama produk atau produsen..." style="width:100%;padding:0.6rem 0.9rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.9rem;">
            </div>
            <div class="data-filter">
              <select id="status-filter">
                <option value="">Semua Status</option>
                <option value="PENDING">PENDING</option>
                <option value="APPROVED">APPROVED</option>
                <option value="REJECTED">REJECTED</option>
              </select>
            </div>
          </div>
          <div class="table-wrapper">
            <table class="data-table">
              <thead><tr><th>Produk</th><th>Produsen</th><th>Kategori</th><th>Harga</th><th>Status</th><th class="table-action-column">Aksi</th></tr></thead>
              <tbody id="produk-body"></tbody>
            </table>
          </div>
        </div>
      </main>
      <footer class="admin-footer"><p>&copy; 2026 Tani Cihawuk &mdash; KKN Cihawuk 1 UMB 2026.</p></footer>
    </div>
  </div>
</div>

<div class="admin-modal" id="detail-modal" style="display:none;"><div class="admin-modal-overlay"></div><div class="admin-modal-content admin-modal-small" id="detail-box"></div></div>

<div class="admin-modal" id="reject-modal" style="display:none;">
  <div class="admin-modal-overlay"></div>
  <div class="admin-modal-content admin-modal-small">
    <div class="admin-modal-header"><h2>Tolak Produk</h2><button type="button" class="modal-close" id="reject-close">&times;</button></div>
    <div class="admin-form">
      <div class="form-group"><label for="reject-reason">Alasan penolakan</label><textarea id="reject-reason" placeholder="Contoh: Foto produk kurang jelas"></textarea></div>
      <div class="admin-modal-actions">
        <button class="btn btn-outline" id="reject-cancel">Batal</button>
        <button class="btn btn-danger" id="reject-confirm">Tolak Produk</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/dash-nav.js"></script>
<script>
(async function(){
  const session = await window.CihawukAuth.requireAdminAuth();
  if(session){
    window.CihawukDashNav.renderShell({role:'admin', activeKey:'produk', name:session.nama, pageTitle:'Kelola Produk'});
    const D = window.CihawukData, UI = window.CihawukUI;
    let filterStatus = '';
    let rejectTargetId = null;
    let searchQuery = '';
    const badgeMap = {APPROVED:'status-available',PENDING:'status-limited',REJECTED:'status-empty'};

    document.getElementById('status-filter').addEventListener('change', async (e)=>{ filterStatus = e.target.value; await render(); });
    document.getElementById('search-input').addEventListener('input', (e)=>{ searchQuery = e.target.value.toLowerCase().trim(); render(); });

    const detailModal = document.getElementById('detail-modal');
    const rejectModal = document.getElementById('reject-modal');

    async function render(){
      let list = await D.getProducts();
      const producers = await D.getProducers();
      const producerMap = {};
      producers.forEach(p => { producerMap[p.id] = p; });

      if(filterStatus) list = list.filter(p=>p.status===filterStatus);
      if(searchQuery){
        list = list.filter(p => {
          const prod = producerMap[p.producerId];
          const prodName = prod ? prod.namaUsaha.toLowerCase() : '';
          return (p.nama && p.nama.toLowerCase().includes(searchQuery)) ||
                 (p.kategori && p.kategori.toLowerCase().includes(searchQuery)) ||
                 prodName.includes(searchQuery);
        });
      }
      list = list.sort((a,b)=>b.createdAt-a.createdAt);

      document.getElementById('produk-body').innerHTML = list.length ? list.map(p=>{
        const producer = producerMap[p.producerId];
        return `<tr>
          <td><div class="table-product"><div class="table-product-image"><img src="${UI.productImg(p.nama, p.foto)}" alt=""></div><div><strong>${p.nama}</strong></div></div></td>
          <td>${producer ? `<a href="produsen.html" style="color:var(--primary-dark);font-weight:600;text-decoration:none;" title="Lihat di Kelola Produsen">${producer.namaUsaha} &rarr;</a>` : '-'}</td>
          <td><span style="font-size:0.85rem;background:var(--surface-soft);padding:0.2rem 0.5rem;border-radius:var(--radius-sm);">${p.kategori}</span></td>
          <td><strong style="color:var(--primary);">${UI.fmtRupiah(p.harga)}</strong></td>
          <td><span class="status-badge ${badgeMap[p.status]}">${p.status}</span></td>
          <td class="table-action-column">
            <div class="table-actions">
              <button class="table-action-button" data-detail="${p.id}" title="Detail">&#128065;</button>
              ${p.status!=='APPROVED' ? `<button class="table-action-button" data-approve="${p.id}" title="Setujui">&#10003;</button>` : ''}
              ${p.status!=='REJECTED' ? `<button class="table-action-button delete-product" data-reject="${p.id}" title="Tolak">&#10005;</button>` : ''}
              <button class="table-action-button delete-product" data-delete="${p.id}" title="Hapus">&#128465;</button>
            </div>
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="6"><div class="empty-state"><h3>Tidak ada produk</h3><p>Tidak ada produk yang cocok dengan filter ini.</p></div></td></tr>`;

      document.querySelectorAll('[data-approve]').forEach(btn=> btn.addEventListener('click', async ()=>{
        btn.disabled = true;
        const all = await D.getProducts();
        const idx = all.findIndex(p=>p.id===btn.dataset.approve);
        if(idx > -1){
          all[idx].status = 'APPROVED'; all[idx].alasanTolak = '';
          const res = await D.saveProducts(all);
          if(res && !res.ok){
            UI.toast('Gagal menyetujui produk: ' + (res.message || 'Terjadi kesalahan.'), 'danger');
            btn.disabled = false;
            return;
          }
          UI.toast('Produk disetujui dan tampil di katalog publik.');
          await render();
        }
      }));
      document.querySelectorAll('[data-delete]').forEach(btn=> btn.addEventListener('click', async ()=>{
        if(confirm('Hapus produk ini?')){
          btn.disabled = true;
          const res = await D.saveProducts((await D.getProducts()).filter(p=>p.id!==btn.dataset.delete));
          if(res && !res.ok){
            UI.toast('Gagal menghapus produk: ' + (res.message || 'Terjadi kesalahan.'), 'danger');
            btn.disabled = false;
            return;
          }
          UI.toast('Produk dihapus.', 'warning');
          await render();
        }
      }));
      document.querySelectorAll('[data-reject]').forEach(btn=> btn.addEventListener('click', ()=>{
        rejectTargetId = btn.dataset.reject;
        document.getElementById('reject-reason').value = '';
        rejectModal.style.display = 'grid';
      }));
      document.querySelectorAll('[data-detail]').forEach(btn=> btn.addEventListener('click', async ()=> await showDetail(btn.dataset.detail)));
      if(window.CihawukDashNav && window.CihawukDashNav.updateBadges){
        window.CihawukDashNav.updateBadges();
      }
    }

    async function showDetail(id){
      const p = await D.getProductById(id);
      const producer = await D.getProducerById(p.producerId);
      let waLink = '#';
      if(producer && producer.whatsapp){
        let clean = producer.whatsapp.replace(/[^0-9]/g, '');
        if(clean.startsWith('0')) clean = '62' + clean.slice(1);
        waLink = `https://wa.me/${clean}`;
      }

      document.getElementById('detail-box').innerHTML = `
        <div class="admin-modal-header">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <div class="table-product-image" style="width:48px;height:48px;border-radius:var(--radius-sm);overflow:hidden;">
              <img src="${UI.productImg(p.nama, p.foto)}" alt="${p.nama}" style="width:100%;height:100%;object-fit:cover;">
            </div>
            <div>
              <h2 style="font-size:1.15rem;margin:0;">${p.nama}</h2>
              <span class="status-badge ${badgeMap[p.status]}" style="margin-top:0.2rem;display:inline-block;">${p.status}</span>
            </div>
          </div>
          <button type="button" class="modal-close" id="detail-close">&times;</button>
        </div>
        <div class="admin-form">
          <div class="profile-meta-grid" style="margin-bottom:1rem;">
            <div class="profile-meta-item">
              <div class="profile-meta-label">Produsen</div>
              <div class="profile-meta-value">${producer ? `<a href="produsen.html" style="color:var(--primary);font-weight:700;">${producer.namaUsaha}</a>` : '-'}</div>
            </div>
            <div class="profile-meta-item">
              <div class="profile-meta-label">Kategori</div>
              <div class="profile-meta-value">${p.kategori}</div>
            </div>
            <div class="profile-meta-item">
              <div class="profile-meta-label">Harga</div>
              <div class="profile-meta-value" style="color:var(--primary);">${UI.fmtRupiah(p.harga)}</div>
            </div>
            <div class="profile-meta-item">
              <div class="profile-meta-label">Ketersediaan</div>
              <div class="profile-meta-value">${p.ketersediaan || 'Tersedia'}</div>
            </div>
            ${producer && producer.whatsapp ? `
            <div class="profile-meta-item" style="grid-column:1/-1;">
              <div class="profile-meta-label">Kontak Produsen</div>
              <div class="profile-meta-value"><a href="${waLink}" target="_blank" style="color:var(--primary);">&#128172; Chat WhatsApp (${producer.whatsapp})</a></div>
            </div>` : ''}
          </div>
          <div>
            <div class="profile-meta-label" style="margin-bottom:0.25rem;">Deskripsi Produk</div>
            <div style="background:var(--surface-soft);padding:0.75rem;border-radius:var(--radius-sm);font-size:0.88rem;line-height:1.5;">
              ${p.deskripsi || '<em style="color:var(--text-muted);">Tidak ada deskripsi produk.</em>'}
            </div>
          </div>
          ${p.status === 'REJECTED' && p.alasanTolak ? `
            <div class="alert alert-danger" style="margin-top:1rem;">
              <strong>Alasan Penolakan:</strong> ${p.alasanTolak}
            </div>` : ''}
          <div class="admin-modal-actions" style="margin-top:1.25rem;display:flex;justify-content:space-between;flex-direction:row;gap:0.5rem;">
            <div>
              ${p.status !== 'APPROVED' ? `<button class="btn btn-primary" id="detail-approve-prod-btn">&#10003; Setujui Produk</button>` : ''}
            </div>
            <button class="btn btn-outline" id="detail-close-2">Tutup</button>
          </div>
        </div>`;
      detailModal.style.display = 'grid';
      const close = ()=> detailModal.style.display = 'none';
      document.getElementById('detail-close').addEventListener('click', close);
      document.getElementById('detail-close-2').addEventListener('click', close);

      const approveProdBtn = document.getElementById('detail-approve-prod-btn');
      if(approveProdBtn){
        approveProdBtn.addEventListener('click', async ()=>{
          close();
          const all = await D.getProducts();
          const idx = all.findIndex(x=>x.id===id);
          if(idx > -1){
            all[idx].status = 'APPROVED'; all[idx].alasanTolak = '';
            const res = await D.saveProducts(all);
            if(res && !res.ok){ UI.toast('Gagal menyetujui produk: ' + (res.message||''), 'danger'); return; }
            UI.toast('Produk disetujui.');
            await render();
          }
        });
      }
    }
    detailModal.querySelector('.admin-modal-overlay').addEventListener('click', ()=> detailModal.style.display='none');

    document.getElementById('reject-cancel').addEventListener('click', ()=> rejectModal.style.display='none');
    document.getElementById('reject-close').addEventListener('click', ()=> rejectModal.style.display='none');
    rejectModal.querySelector('.admin-modal-overlay').addEventListener('click', ()=> rejectModal.style.display='none');
    document.getElementById('reject-confirm').addEventListener('click', async ()=>{
      const confirmBtn = document.getElementById('reject-confirm');
      confirmBtn.disabled = true;
      const all = await D.getProducts();
      const idx = all.findIndex(p=>p.id===rejectTargetId);
      if(idx > -1){
        all[idx].status = 'REJECTED';
        all[idx].alasanTolak = document.getElementById('reject-reason').value.trim();
        const res = await D.saveProducts(all);
        confirmBtn.disabled = false;
        if(res && !res.ok){
          UI.toast('Gagal menolak produk: ' + (res.message || 'Terjadi kesalahan.'), 'danger');
          return;
        }
        rejectModal.style.display = 'none';
        UI.toast('Produk ditolak.', 'warning');
        await render();
      }
    });

    await render();
  }
})();
</script>
</body>
</html>
