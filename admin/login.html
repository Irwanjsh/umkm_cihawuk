<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Administrator — Tani Cihawuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="admin-login-page">
  <div class="admin-login-wrapper">
    <div class="admin-login-brand">
      <div class="admin-login-brand-icon">&#127811;</div>
      <strong>Tani Cihawuk</strong>
      <span>Panel Administrator</span>
    </div>
    <div class="admin-login-card">
      <div class="admin-login-header">
        <h1>Login Administrator</h1>
        <p>Khusus pengelola sistem Tani Cihawuk (BUMDes).</p>
      </div>

      <div id="login-status"></div>

      <form id="admin-login-form" class="admin-login-form">
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" required placeholder="admin@cihawuk.desa"></div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" required placeholder="Kata sandi administrator">
          <div class="show-password-check">
            <label for="show-password-admin">
              <input type="checkbox" id="show-password-admin" class="show-password-toggle" onchange="document.getElementById('password').type = this.checked ? 'text' : 'password'">
              <span>Tampilkan kata sandi</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="admin-login-footer">
        <a href="../index.html" class="forgot-password">&larr; Kembali ke situs publik</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
(async function(){
  const existing = await window.CihawukAuth.getSession();
  if(existing && existing.role === 'admin') window.location.href = 'dashboard.html';

  document.getElementById('admin-login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const result = await window.CihawukAuth.loginAdmin(email, password);
    if(!result.ok){
      document.getElementById('login-status').innerHTML = `<div class="alert alert-danger" style="margin-bottom:1rem;">${result.message}</div>`;
      return;
    }
    window.location.href = 'dashboard.html';
  });
})();
</script>
</body>
</html>
