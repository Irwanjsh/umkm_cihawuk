<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Produsen — Tani Cihawuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="role-admin">
<div class="admin-page">
  <div class="admin-layout">
    <div id="dash-sidebar-mount"></div>
    <div class="admin-main">
      <div id="dash-topbar-mount"></div>
      <main class="admin-content">
        <div class="admin-page-header">
          <div>
            <h1>Kelola Produsen</h1>
            <p>Klik pada nama produsen untuk melihat profil lengkap dan seluruh produknya.</p>
          </div>
        </div>

        <div class="admin-card">
          <div class="data-toolbar" style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between;align-items:center;">
            <div style="flex:1;min-width:240px;max-width:400px;">
              <input type="text" id="search-input" placeholder="Cari nama usaha, pemilik, atau no hp..." style="width:100%;padding:0.6rem 0.9rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.9rem;">
            </div>
            <div class="data-filter">
              <select id="status-filter">
                <option value="">Semua Status</option>
                <option value="ACTIVE">ACTIVE (Aktif)</option>
                <option value="PENDING">PENDING (Menunggu)</option>
                <option value="REJECTED">REJECTED (Ditolak)</option>
                <option value="SUSPENDED">SUSPENDED (Dinonaktifkan)</option>
              </select>
            </div>
          </div>
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Usaha</th>
                  <th>Pemilik & Kontak</th>
                  <th>Kategori</th>
                  <th>Produk</th>
                  <th>Status</th>
                  <th class="table-action-column">Aksi</th>
                </tr>
              </thead>
              <tbody id="produsen-body"></tbody>
            </table>
          </div>
        </div>
      </main>
      <footer class="admin-footer"><p>&copy; 2026 Tani Cihawuk &mdash; KKN Cihawuk 1 UMB 2026.</p></footer>
    </div>
  </div>
</div>

<!-- MODAL PROFIL LENGKAP & PRODUK PRODUSEN -->
<div class="admin-modal" id="profile-modal" style="display:none;">
  <div class="admin-modal-overlay"></div>
  <div class="admin-modal-content admin-modal-large" id="profile-modal-box"></div>
</div>

<!-- MODAL EDIT DATA PRODUSEN -->
<div class="admin-modal" id="edit-modal" style="display:none;">
  <div class="admin-modal-overlay"></div>
  <div class="admin-modal-content admin-modal-small">
    <div class="admin-modal-header">
      <h2>Edit Data Produsen</h2>
      <button type="button" class="modal-close" id="edit-close">&times;</button>
    </div>
    <form id="edit-form" class="admin-form">
      <input type="hidden" id="edit-id">
      <div class="form-group"><label for="edit-namaUsaha">Nama Usaha</label><input type="text" id="edit-namaUsaha" required></div>
      <div class="form-group"><label for="edit-namaLengkap">Nama Pemilik</label><input type="text" id="edit-namaLengkap" required></div>
      <div class="form-group"><label for="edit-whatsapp">WhatsApp</label><input type="text" id="edit-whatsapp" required></div>
      <div class="form-group"><label for="edit-alamat">Alamat Usaha</label><input type="text" id="edit-alamat" required></div>
      <div class="form-group"><label for="edit-kategori">Kategori</label><select id="edit-kategori"></select></div>
      <div class="form-group"><label for="edit-deskripsi">Deskripsi Usaha</label><textarea id="edit-deskripsi" rows="3"></textarea></div>
      <div class="admin-modal-actions">
        <button type="button" class="btn btn-outline" id="edit-cancel">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL TOLAK PRODUK -->
<div class="admin-modal" id="reject-product-modal" style="display:none;">
  <div class="admin-modal-overlay"></div>
  <div class="admin-modal-content admin-modal-small">
    <div class="admin-modal-header"><h2>Tolak Produk</h2><button type="button" class="modal-close" id="reject-prod-close">&times;</button></div>
    <div class="admin-form">
      <div class="form-group"><label for="reject-prod-reason">Alasan penolakan</label><textarea id="reject-prod-reason" placeholder="Contoh: Foto produk kurang jelas"></textarea></div>
      <div class="admin-modal-actions">
        <button class="btn btn-outline" id="reject-prod-cancel">Batal</button>
        <button class="btn btn-danger" id="reject-prod-confirm">Tolak Produk</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/dash-nav.js"></script>
<script>
(async function(){
  const session = await window.CihawukAuth.requireAdminAuth();
  if(session){
    window.CihawukDashNav.renderShell({role:'admin', activeKey:'produsen', name:session.nama, pageTitle:'Kelola Produsen'});
    const D = window.CihawukData, UI = window.CihawukUI;
    let filterStatus = '';
    let searchQuery = '';
    let rejectProductTargetId = null;
    let currentProfileProducerId = null;
    const badgeMap = {ACTIVE:'status-available',PENDING:'status-limited',REJECTED:'status-empty',SUSPENDED:'status-inactive'};
    const prodBadgeMap = {APPROVED:'status-available',PENDING:'status-limited',REJECTED:'status-empty'};

    document.getElementById('status-filter').addEventListener('change', async (e)=>{
      filterStatus = e.target.value;
      await render();
    });

    document.getElementById('search-input').addEventListener('input', (e)=>{
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    const katSelect = document.getElementById('edit-kategori');
    katSelect.innerHTML = D.KATEGORI_USAHA.map(k=>`<option value="${k}">${k}</option>`).join('');

    function formatWaLink(phone){
      if(!phone) return '#';
      let clean = phone.replace(/[^0-9]/g, '');
      if(clean.startsWith('0')) clean = '62' + clean.slice(1);
      return `https://wa.me/${clean}`;
    }

    async function render(){
      let list = await D.getProducers();
      const allProducts = await D.getProducts();

      if(filterStatus) list = list.filter(p=>p.status===filterStatus);
      if(searchQuery){
        list = list.filter(p => 
          (p.namaUsaha && p.namaUsaha.toLowerCase().includes(searchQuery)) ||
          (p.namaLengkap && p.namaLengkap.toLowerCase().includes(searchQuery)) ||
          (p.whatsapp && p.whatsapp.includes(searchQuery)) ||
          (p.email && p.email.toLowerCase().includes(searchQuery)) ||
          (p.kategori && p.kategori.toLowerCase().includes(searchQuery))
        );
      }
      list = list.sort((a,b)=>b.createdAt-a.createdAt);

      const productCountMap = {};
      allProducts.forEach(prod=>{
        productCountMap[prod.producerId] = (productCountMap[prod.producerId] || 0) + 1;
      });

      document.getElementById('produsen-body').innerHTML = list.length ? list.map(p=>{
        const pCount = productCountMap[p.id] || 0;
        return `
        <tr>
          <td>
            <div class="table-person clickable-producer" data-profile="${p.id}" title="Klik untuk melihat profil lengkap" style="cursor:pointer;">
              <div class="table-person-avatar">
                <img src="${UI.farmerImg(p.namaUsaha, p.foto)}" alt="${p.namaUsaha}">
              </div>
              <div>
                <strong style="color:var(--primary-dark);">${p.namaUsaha}</strong>
                <div style="font-size:0.8rem;color:var(--text-muted);">&#128065; Lihat Profil</div>
              </div>
            </div>
          </td>
          <td>
            <div><strong>${p.namaLengkap}</strong></div>
            <div style="font-size:0.8rem;color:var(--text-secondary);display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.15rem;">
              <a href="${formatWaLink(p.whatsapp)}" target="_blank" style="color:var(--primary);text-decoration:none;">&#128172; ${p.whatsapp}</a>
              <span style="color:var(--border);">&bull;</span>
              <span>${p.email}</span>
            </div>
          </td>
          <td><span style="font-size:0.85rem;background:var(--surface-soft);padding:0.2rem 0.5rem;border-radius:var(--radius-sm);">${p.kategori}</span></td>
          <td>
            <button class="btn btn-sm btn-outline" data-profile="${p.id}" title="Lihat ${pCount} produk" style="font-size:0.8rem;padding:0.25rem 0.6rem;">
              &#128230; ${pCount} Produk
            </button>
          </td>
          <td><span class="status-badge ${badgeMap[p.status] || ''}">${p.status}</span></td>
          <td class="table-action-column">
            <div class="table-actions">
              <button class="table-action-button" data-profile="${p.id}" title="Lihat Profil & Produk">&#128065;</button>
              <button class="table-action-button" data-edit="${p.id}" title="Edit Data Produsen">&#9998;</button>
              ${p.status==='ACTIVE' ? `<button class="table-action-button delete-farmer" data-suspend="${p.id}" title="Nonaktifkan">&#9209;</button>` : ''}
              ${p.status==='SUSPENDED' ? `<button class="table-action-button" data-activate="${p.id}" title="Aktifkan Kembali">&#9654;</button>` : ''}
              ${p.status==='PENDING' ? `<button class="table-action-button" data-approve="${p.id}" title="Setujui Produsen">&#10003;</button>` : ''}
              <button class="table-action-button delete-farmer" data-delete="${p.id}" title="Hapus Produsen">&#128465;</button>
            </div>
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="6"><div class="empty-state"><h3>Tidak ada produsen ditemukan</h3><p>Coba sesuaikan filter atau kata kunci pencarian.</p></div></td></tr>`;

      // Event listeners for action buttons & profile click
      document.querySelectorAll('[data-profile]').forEach(btn=> {
        btn.addEventListener('click', async (e)=> {
          e.stopPropagation();
          await showProducerProfile(btn.dataset.profile);
        });
      });

      document.querySelectorAll('[data-suspend]').forEach(btn=> btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        btn.disabled = true;
        await setStatus(btn.dataset.suspend,'SUSPENDED');
      }));

      document.querySelectorAll('[data-activate]').forEach(btn=> btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        btn.disabled = true;
        await setStatus(btn.dataset.activate,'ACTIVE');
      }));

      document.querySelectorAll('[data-approve]').forEach(btn=> btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        btn.disabled = true;
        await setStatus(btn.dataset.approve,'ACTIVE');
      }));

      document.querySelectorAll('[data-delete]').forEach(btn=> btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(confirm('Hapus akun produsen ini beserta seluruh produknya? Tindakan ini tidak dapat dibatalkan.')){
          btn.disabled = true;
          const res1 = await D.saveProducers((await D.getProducers()).filter(p=>p.id!==btn.dataset.delete));
          if(res1 && !res1.ok){
            UI.toast('Gagal menghapus produsen: ' + (res1.message || 'Terjadi kesalahan.'), 'danger');
            btn.disabled = false;
            return;
          }
          await D.saveProducts((await D.getProducts()).filter(p=>p.producerId!==btn.dataset.delete));
          UI.toast('Produsen beserta produknya berhasil dihapus.', 'warning');
          await render();
        }
      }));

      document.querySelectorAll('[data-edit]').forEach(btn=> btn.addEventListener('click', async (e)=> {
        e.stopPropagation();
        await openEdit(btn.dataset.edit);
      }));
    }

    async function setStatus(id, status){
      const all = await D.getProducers();
      const idx = all.findIndex(p=>p.id===id);
      if(idx > -1){
        all[idx].status = status;
        if(status === 'ACTIVE') all[idx].alasanTolak = '';
        const res = await D.saveProducers(all);
        if(res && !res.ok){
          UI.toast('Gagal mengubah status: ' + (res.message || 'Terjadi kesalahan.'), 'danger');
          await render();
          return;
        }
        UI.toast(status==='ACTIVE' ? 'Akun produsen aktif.' : 'Akun produsen dinonaktifkan.', status==='ACTIVE' ? 'success' : 'warning');
        await render();
        if(currentProfileProducerId === id){
          await showProducerProfile(id);
        }
      }
    }

    // DETAIL PROFIL & PRODUK MODAL
    const profileModal = document.getElementById('profile-modal');
    async function showProducerProfile(id){
      currentProfileProducerId = id;
      const p = await D.getProducerById(id);
      if(!p){ UI.toast('Data produsen tidak ditemukan.', 'danger'); return; }

      const allProducts = await D.getProducts();
      const producerProducts = allProducts.filter(prod => prod.producerId === id).sort((a,b)=>b.createdAt-a.createdAt);

      const totalApproved = producerProducts.filter(pr=>pr.status==='APPROVED').length;
      const totalPending = producerProducts.filter(pr=>pr.status==='PENDING').length;
      const totalRejected = producerProducts.filter(pr=>pr.status==='REJECTED').length;

      const registeredDate = p.createdAt ? new Date(p.createdAt).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'}) : '-';
      const waLink = formatWaLink(p.whatsapp);

      document.getElementById('profile-modal-box').innerHTML = `
        <div class="admin-modal-header">
          <div>
            <h2 style="font-size:1.3rem;">Detail Profil Produsen</h2>
            <p style="margin:0.2rem 0 0;font-size:0.85rem;color:var(--text-secondary);">Informasi lengkap usaha dan daftar produk terdaftar</p>
          </div>
          <button type="button" class="modal-close" id="profile-close">&times;</button>
        </div>

        <div style="padding:1.25rem;">
          <!-- Hero Info -->
          <div class="profile-hero-card">
            <div class="profile-hero-avatar">
              <img src="${UI.farmerImg(p.namaUsaha, p.foto)}" alt="${p.namaUsaha}">
            </div>
            <div class="profile-hero-info">
              <h3>
                ${p.namaUsaha}
                <span class="status-badge ${badgeMap[p.status] || ''}">${p.status}</span>
              </h3>
              <div class="profile-hero-meta">
                <span>&#128197; Terdaftar: <strong>${registeredDate}</strong></span>
                <span>&#127991; Kategori: <strong>${p.kategori}</strong></span>
              </div>
            </div>
            <div class="profile-hero-actions">
              <a href="${waLink}" target="_blank" class="btn btn-sm btn-primary" style="background:#25d366;border-color:#25d366;color:#ffffff;display:inline-flex;align-items:center;gap:0.4rem;">
                <span>&#128172;</span> Chat WA
              </a>
              <a href="mailto:${p.email}" class="btn btn-sm btn-outline" style="display:inline-flex;align-items:center;gap:0.4rem;">
                <span>&#9993;</span> Email
              </a>
              <button class="btn btn-sm btn-outline" id="modal-edit-btn" style="display:inline-flex;align-items:center;gap:0.4rem;">
                <span>&#9998;</span> Edit
              </button>
            </div>
          </div>

          <!-- Mini Stats -->
          <div class="profile-stats-grid">
            <div class="profile-stat-box">
              <div class="stat-icon">&#128230;</div>
              <div>
                <div class="stat-num">${producerProducts.length}</div>
                <div class="stat-label">Total Produk</div>
              </div>
            </div>
            <div class="profile-stat-box">
              <div class="stat-icon" style="color:var(--primary);">&#9989;</div>
              <div>
                <div class="stat-num">${totalApproved}</div>
                <div class="stat-label">Disetujui (Katalog)</div>
              </div>
            </div>
            <div class="profile-stat-box">
              <div class="stat-icon" style="color:#d97706;">&#8987;</div>
              <div>
                <div class="stat-num">${totalPending}</div>
                <div class="stat-label">Menunggu Verifikasi</div>
              </div>
            </div>
            <div class="profile-stat-box">
              <div class="stat-icon" style="color:var(--danger);">&#10060;</div>
              <div>
                <div class="stat-num">${totalRejected}</div>
                <div class="stat-label">Ditolak</div>
              </div>
            </div>
          </div>

          <!-- Status Alert if Rejected or Suspended -->
          ${p.status === 'REJECTED' ? `
            <div class="alert alert-danger" style="margin-bottom:1.25rem;">
              <strong>Pendaftaran Ditolak:</strong> ${p.alasanTolak || 'Tidak ada alasan khusus.'}
            </div>` : ''}
          ${p.status === 'SUSPENDED' ? `
            <div class="alert alert-warning" style="margin-bottom:1.25rem;">
              <strong>Akun Dinonaktifkan:</strong> Produk dari produsen ini disembunyikan sementara dari katalog publik.
            </div>` : ''}

          <!-- Grid Biodata -->
          <div class="profile-meta-grid">
            <div class="profile-meta-item">
              <div class="profile-meta-label">Nama Pemilik</div>
              <div class="profile-meta-value">${p.namaLengkap}</div>
            </div>
            <div class="profile-meta-item">
              <div class="profile-meta-label">Nomor WhatsApp</div>
              <div class="profile-meta-value"><a href="${waLink}" target="_blank">${p.whatsapp}</a></div>
            </div>
            <div class="profile-meta-item">
              <div class="profile-meta-label">Email Akun</div>
              <div class="profile-meta-value"><a href="mailto:${p.email}">${p.email}</a></div>
            </div>
            <div class="profile-meta-item">
              <div class="profile-meta-label">Alamat Usaha</div>
              <div class="profile-meta-value">${p.alamat || '-'}</div>
            </div>
          </div>

          <div style="margin-bottom:1.5rem;">
            <div class="profile-meta-label" style="margin-bottom:0.4rem;">Deskripsi Usaha</div>
            <div style="background:var(--surface-soft);padding:0.85rem 1rem;border-radius:var(--radius-sm);font-size:0.9rem;line-height:1.6;color:var(--text-primary);">
              ${p.deskripsi ? p.deskripsi : '<em style="color:var(--text-muted);">Belum ada deskripsi usaha.</em>'}
            </div>
          </div>

          <!-- Section: Daftar Produk -->
          <div class="profile-section-title">
            <span>Daftar Produk (${producerProducts.length})</span>
          </div>

          <div class="table-wrapper" style="border:1px solid var(--border-light);border-radius:var(--radius-sm);max-height:280px;overflow-y:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Produk</th>
                  <th>Kategori</th>
                  <th>Harga</th>
                  <th>Stok</th>
                  <th>Status</th>
                  <th class="table-action-column">Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${producerProducts.length ? producerProducts.map(prod => `
                  <tr>
                    <td>
                      <div class="table-product">
                        <div class="table-product-image" style="width:40px;height:40px;">
                          <img src="${UI.productImg(prod.nama, prod.foto)}" alt="${prod.nama}">
                        </div>
                        <div><strong>${prod.nama}</strong></div>
                      </div>
                    </td>
                    <td><span style="font-size:0.82rem;">${prod.kategori}</span></td>
                    <td><strong style="color:var(--primary);">${UI.fmtRupiah(prod.harga)}</strong></td>
                    <td><span style="font-size:0.82rem;">${prod.ketersediaan || 'Tersedia'}</span></td>
                    <td><span class="status-badge ${prodBadgeMap[prod.status] || ''}">${prod.status}</span></td>
                    <td class="table-action-column">
                      <div class="table-actions">
                        ${prod.status !== 'APPROVED' ? `<button class="table-action-button" data-prod-approve="${prod.id}" title="Setujui Produk">&#10003;</button>` : ''}
                        ${prod.status !== 'REJECTED' ? `<button class="table-action-button delete-product" data-prod-reject="${prod.id}" title="Tolak Produk">&#10005;</button>` : ''}
                        <button class="table-action-button delete-product" data-prod-delete="${prod.id}" title="Hapus Produk">&#128465;</button>
                      </div>
                    </td>
                  </tr>`).join('') : `
                  <tr>
                    <td colspan="6">
                      <div class="empty-state" style="padding:1.5rem 1rem;">
                        <p style="margin:0;color:var(--text-muted);">Produsen ini belum mendaftarkan produk apapun.</p>
                      </div>
                    </td>
                  </tr>`}
              </tbody>
            </table>
          </div>

          <div class="admin-modal-actions" style="margin-top:1.5rem;display:flex;justify-content:space-between;flex-direction:row;flex-wrap:wrap;gap:0.75rem;">
            <div>
              ${p.status==='ACTIVE' ? `<button class="btn btn-outline btn-sm" id="modal-suspend-btn" style="color:var(--danger);border-color:var(--danger);">&#9209; Nonaktifkan Akun</button>` : ''}
              ${p.status==='SUSPENDED' ? `<button class="btn btn-primary btn-sm" id="modal-activate-btn">&#9654; Aktifkan Akun</button>` : ''}
              ${p.status==='PENDING' ? `<button class="btn btn-primary btn-sm" id="modal-approve-btn">&#10003; Setujui Pendaftaran</button>` : ''}
            </div>
            <button type="button" class="btn btn-outline" id="profile-close-btn">Tutup</button>
          </div>
        </div>`;

      profileModal.style.display = 'grid';

      // Bind close buttons
      const closeProfile = () => { profileModal.style.display = 'none'; currentProfileProducerId = null; };
      document.getElementById('profile-close').addEventListener('click', closeProfile);
      document.getElementById('profile-close-btn').addEventListener('click', closeProfile);

      // Edit from modal
      document.getElementById('modal-edit-btn').addEventListener('click', async ()=>{
        closeProfile();
        await openEdit(id);
      });

      // Quick Status Change from modal
      const suspendBtn = document.getElementById('modal-suspend-btn');
      if(suspendBtn) suspendBtn.addEventListener('click', async ()=>{ await setStatus(id, 'SUSPENDED'); });

      const activateBtn = document.getElementById('modal-activate-btn');
      if(activateBtn) activateBtn.addEventListener('click', async ()=>{ await setStatus(id, 'ACTIVE'); });

      const approveBtn = document.getElementById('modal-approve-btn');
      if(approveBtn) approveBtn.addEventListener('click', async ()=>{ await setStatus(id, 'ACTIVE'); });

      // Product actions inside profile modal
      document.querySelectorAll('[data-prod-approve]').forEach(btn => {
        btn.addEventListener('click', async ()=>{
          btn.disabled = true;
          const prods = await D.getProducts();
          const idx = prods.findIndex(x=>x.id===btn.dataset.prodApprove);
          if(idx > -1){
            prods[idx].status = 'APPROVED'; prods[idx].alasanTolak = '';
            const res = await D.saveProducts(prods);
            if(res && !res.ok){ UI.toast('Gagal menyetujui produk: ' + (res.message || ''), 'danger'); return; }
            UI.toast('Produk disetujui.');
            await showProducerProfile(id);
            await render();
          }
        });
      });

      document.querySelectorAll('[data-prod-reject]').forEach(btn => {
        btn.addEventListener('click', ()=>{
          rejectProductTargetId = btn.dataset.prodReject;
          document.getElementById('reject-prod-reason').value = '';
          document.getElementById('reject-product-modal').style.display = 'grid';
        });
      });

      document.querySelectorAll('[data-prod-delete]').forEach(btn => {
        btn.addEventListener('click', async ()=>{
          if(confirm('Hapus produk ini?')){
            btn.disabled = true;
            const prods = await D.getProducts();
            const res = await D.saveProducts(prods.filter(x=>x.id!==btn.dataset.prodDelete));
            if(res && !res.ok){ UI.toast('Gagal menghapus produk: ' + (res.message || ''), 'danger'); return; }
            UI.toast('Produk dihapus.', 'warning');
            await showProducerProfile(id);
            await render();
          }
        });
      });
    }

    profileModal.querySelector('.admin-modal-overlay').addEventListener('click', ()=>{
      profileModal.style.display = 'none';
      currentProfileProducerId = null;
    });

    // Product Reject modal logic
    const rejectProductModal = document.getElementById('reject-product-modal');
    document.getElementById('reject-prod-close').addEventListener('click', ()=> rejectProductModal.style.display='none');
    document.getElementById('reject-prod-cancel').addEventListener('click', ()=> rejectProductModal.style.display='none');
    rejectProductModal.querySelector('.admin-modal-overlay').addEventListener('click', ()=> rejectProductModal.style.display='none');

    document.getElementById('reject-prod-confirm').addEventListener('click', async ()=>{
      const confirmBtn = document.getElementById('reject-prod-confirm');
      confirmBtn.disabled = true;
      const all = await D.getProducts();
      const idx = all.findIndex(p=>p.id===rejectProductTargetId);
      if(idx > -1){
        all[idx].status = 'REJECTED';
        all[idx].alasanTolak = document.getElementById('reject-prod-reason').value.trim();
        const res = await D.saveProducts(all);
        confirmBtn.disabled = false;
        if(res && !res.ok){
          UI.toast('Gagal menolak produk: ' + (res.message || 'Terjadi kesalahan.'), 'danger');
          return;
        }
        rejectProductModal.style.display = 'none';
        UI.toast('Produk ditolak.', 'warning');
        if(currentProfileProducerId){
          await showProducerProfile(currentProfileProducerId);
        }
        await render();
      }
    });

    // EDIT MODAL LOGIC
    const modal = document.getElementById('edit-modal');
    async function openEdit(id){
      const p = await D.getProducerById(id);
      document.getElementById('edit-id').value = p.id;
      document.getElementById('edit-namaUsaha').value = p.namaUsaha;
      document.getElementById('edit-namaLengkap').value = p.namaLengkap;
      document.getElementById('edit-whatsapp').value = p.whatsapp;
      document.getElementById('edit-alamat').value = p.alamat || '';
      document.getElementById('edit-kategori').value = p.kategori;
      document.getElementById('edit-deskripsi').value = p.deskripsi || '';
      modal.style.display = 'grid';
    }
    function closeEdit(){ modal.style.display = 'none'; }
    document.getElementById('edit-cancel').addEventListener('click', closeEdit);
    document.getElementById('edit-close').addEventListener('click', closeEdit);
    modal.querySelector('.admin-modal-overlay').addEventListener('click', closeEdit);

    document.getElementById('edit-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const saveBtn = e.target.querySelector('button[type=submit]');
      saveBtn.disabled = true;
      const all = await D.getProducers();
      const targetId = document.getElementById('edit-id').value;
      const idx = all.findIndex(p=>p.id===targetId);
      if(idx > -1){
        all[idx] = Object.assign({}, all[idx], {
          namaUsaha: document.getElementById('edit-namaUsaha').value.trim(),
          namaLengkap: document.getElementById('edit-namaLengkap').value.trim(),
          whatsapp: document.getElementById('edit-whatsapp').value.trim(),
          alamat: document.getElementById('edit-alamat').value.trim(),
          kategori: document.getElementById('edit-kategori').value,
          deskripsi: document.getElementById('edit-deskripsi').value.trim()
        });
        const res = await D.saveProducers(all);
        saveBtn.disabled = false;
        if(res && !res.ok){
          UI.toast('Gagal menyimpan perubahan: ' + (res.message || 'Terjadi kesalahan.'), 'danger');
          return;
        }
        closeEdit();
        UI.toast('Data produsen berhasil diperbarui.');
        await render();
      }
    });

    await render();
  }
})();
</script>
</body>
</html>
