<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Produsen — Tani Cihawuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="role-produsen">
<div class="admin-login-page">
  <div class="admin-login-wrapper">
    <div class="admin-login-brand">
      <div class="admin-login-brand-icon">&#127811;</div>
      <strong>Tani Cihawuk</strong>
      <span>Panel Produsen</span>
    </div>
    <div class="admin-login-card">
      <div class="admin-login-header">
        <h1>Login Produsen</h1>
        <p>Masuk untuk mengelola profil usaha dan produk Anda.</p>
      </div>

      <div id="login-status"></div>

      <form id="login-form" class="admin-login-form">
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" required placeholder="nama@email.com"></div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="password-input-wrap">
            <input type="password" id="password" required placeholder="Kata sandi Anda">
            <button type="button" class="password-toggle-btn" aria-label="Tampilkan kata sandi" title="Tampilkan kata sandi">
              <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            </button>
          </div>
        </div>
        <div class="login-options">
          <span></span>
          <a href="#" id="lupa-password-link" class="forgot-password">Lupa password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="admin-login-footer">
        Belum punya akun? <a href="../daftar-produsen.html" class="forgot-password">Daftar sebagai Produsen</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
(async function(){
  const existing = await window.CihawukAuth.getSession();
  if(existing && existing.role === 'produsen' && existing.status === 'ACTIVE'){
    window.location.href = 'dashboard.html';
  }

  const statusBox = document.getElementById('login-status');

  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const result = await window.CihawukAuth.loginProducer(email, password);

    statusBox.innerHTML = '';
    if(!result.ok){
      statusBox.innerHTML = `<div class="alert alert-danger" style="margin-bottom:1rem;">${result.message}</div>`;
      return;
    }
    if(result.blocked){
      const p = result.producer;
      if(p.status === 'PENDING'){
        statusBox.innerHTML = `<div class="alert alert-warning" style="margin-bottom:1rem;">Akun Anda masih menunggu verifikasi admin.</div>`;
      } else if(p.status === 'REJECTED'){
        statusBox.innerHTML = `<div class="alert alert-danger" style="margin-bottom:1rem;">Pendaftaran Anda ditolak.${p.alasan_tolak ? ' Alasan: ' + p.alasan_tolak : ''}</div>`;
      } else if(p.status === 'SUSPENDED'){
        statusBox.innerHTML = `<div class="alert alert-danger" style="margin-bottom:1rem;">Akun Anda sedang dinonaktifkan oleh admin. Hubungi pengelola desa untuk informasi lebih lanjut.</div>`;
      }
      return;
    }
    window.location.href = 'dashboard.html';
  });

  document.getElementById('lupa-password-link').addEventListener('click', (e)=>{
    e.preventDefault();
    alert('Fitur reset password belum tersedia di prototype ini. Hubungi admin desa untuk bantuan.');
  });
})();
</script>
</body>
</html>
