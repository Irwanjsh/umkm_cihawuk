<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Produsen — Tani Cihawuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="role-produsen">
<div class="admin-page">
  <div class="admin-layout">
    <div id="dash-sidebar-mount"></div>
    <div class="admin-main">
      <div id="dash-topbar-mount"></div>
      <main class="admin-content">
        <div class="admin-page-header">
          <div><h1>Dashboard</h1><p id="dash-sub"></p></div>
        </div>

        <div class="admin-statistics" id="kpi-grid"></div>

        <div class="admin-card">
          <div class="dashboard-card-header"><h2>Produk Terbaru</h2><a href="produk.html">Lihat semua &rarr;</a></div>
          <div class="table-wrapper">
            <table class="data-table">
              <thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Ketersediaan</th><th>Status</th></tr></thead>
              <tbody id="recent-products-body"></tbody>
            </table>
          </div>
        </div>
      </main>
      <footer class="admin-footer"><p>&copy;Tani Cihawuk &mdash; Proker KKN UMB kel_Cihawuk1_2026</p></footer>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/dash-nav.js"></script>
<script>
(async function(){
  const producer = await window.CihawukAuth.requireProducerAuth();
  if(producer){
    window.CihawukDashNav.renderShell({role:'produsen', activeKey:'dashboard', name:producer.nama_usaha, avatarUrl:producer.foto_path, pageTitle:'Dashboard'});
    const D = window.CihawukData, UI = window.CihawukUI;

    document.getElementById('dash-sub').textContent = `Selamat datang, ${producer.nama_usaha}`;

    const products = await D.getProductsByProducer(producer.id);
    const approved = products.filter(p=>p.status==='APPROVED').length;
    const pending = products.filter(p=>p.status==='PENDING').length;
    const rejected = products.filter(p=>p.status==='REJECTED').length;

    const statusBadgeMap = {ACTIVE:'status-available',PENDING:'status-limited',REJECTED:'status-empty',SUSPENDED:'status-inactive'};

    document.getElementById('kpi-grid').innerHTML = `
      <div class="stat-card"><div class="stat-card-icon">&#9989;</div><div class="stat-card-content"><span>Status Akun</span><strong><span class="status-badge ${statusBadgeMap[producer.status]}">${producer.status}</span></strong></div></div>
      <div class="stat-card"><div class="stat-card-icon">&#128715;</div><div class="stat-card-content"><span>Jumlah Produk</span><strong>${products.length}</strong></div></div>
      <div class="stat-card"><div class="stat-card-icon">&#128203;</div><div class="stat-card-content"><span>Disetujui</span><strong>${approved}</strong></div></div>
      <div class="stat-card"><div class="stat-card-icon">&#8987;</div><div class="stat-card-content"><span>Menunggu / Ditolak</span><strong>${pending} / ${rejected}</strong></div></div>`;

    const badgeMap = {APPROVED:'status-available',PENDING:'status-limited',REJECTED:'status-empty'};
    const recent = [...products].sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
    document.getElementById('recent-products-body').innerHTML = recent.length ? recent.map(p=>`
      <tr>
        <td><div class="table-product"><div class="table-product-image"><img src="${UI.productImg(p.nama, p.foto)}" alt=""></div><div><strong>${p.nama}</strong></div></div></td>
        <td>${p.kategori}</td>
        <td>${UI.fmtRupiah(p.harga)}</td>
        <td>${p.ketersediaan}</td>
        <td><span class="status-badge ${badgeMap[p.status]}">${p.status}</span></td>
      </tr>`).join('') : `<tr><td colspan="5"><div class="empty-state"><h3>Belum ada produk</h3><p><a href="tambah-produk.html">Tambah produk pertama Anda</a>.</p></div></td></tr>`;
  }
})();
</script>
</body>
</html>
