<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk — Tani Cihawuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="page-content">
  <div class="section">
    <div class="container" id="pd-container"></div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async function(){
  CihawukUI.renderPublicNav('katalog','');
  CihawukUI.renderPublicFooter('');
  const D = window.CihawukData, UI = window.CihawukUI;

  const id = new URLSearchParams(location.search).get('id');
  const product = await D.getProductById(id);
  const container = document.getElementById('pd-container');

  if(!product || product.status !== 'APPROVED'){
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#128683;</div>
      <h3>Produk tidak ditemukan</h3>
      <p>Produk ini mungkin belum disetujui admin atau sudah dihapus.</p>
      <a href="katalog.html" class="btn btn-outline">Kembali ke Katalog</a></div>`;
  } else {
    const producer = await D.getProducerById(product.producerId);
    const isAkanTersedia = product.ketersediaan === 'Akan Tersedia';
    const isTersedia = product.ketersediaan === 'Tersedia';

    let defaultMsg = `Halo ${producer.namaUsaha}, saya melihat produk "${product.nama}" di Tani Cihawuk. Apakah masih tersedia?`;
    if(isAkanTersedia){
      defaultMsg = `Halo ${producer.namaUsaha}, saya tertarik untuk memesan/Pre-Order produk "${product.nama}" (estimasi tersedia: ${product.estimasiTersedia || 'dalam waktu dekat'}) di Tani Cihawuk. Boleh info detailnya?`;
    }
    const waText = encodeURIComponent(defaultMsg);
    let waPhone = (producer.whatsapp || '').replace(/[^0-9]/g, '');
    if(waPhone.startsWith('0')) waPhone = '62' + waPhone.slice(1);
    const waLink = `https://wa.me/${waPhone}?text=${waText}`;

    container.innerHTML = `
      <div class="breadcrumb"><a href="katalog.html">Katalog</a><span class="breadcrumb-separator">/</span><span>${product.nama}</span></div>
      <div class="product-detail">
        <div class="product-detail-image"><img src="${UI.productImg(product.nama, product.foto)}" alt="${product.nama}"></div>
        <div class="product-detail-content">
          <span class="product-detail-category">${product.kategori}</span>
          <h1 class="product-detail-title">${product.nama}</h1>
          <div class="product-detail-price">${UI.fmtRupiah(product.harga)}</div>
          <p class="product-detail-description">${product.deskripsi}</p>

          <div class="product-detail-info">
            <div class="product-info-row">
              <span class="product-info-label">Ketersediaan</span>
              <span class="product-info-value">${UI.ketersediaanBadge(product.ketersediaan, product.estimasiTersedia)}</span>
            </div>
            <div class="product-info-row"><span class="product-info-label">Kategori</span><span class="product-info-value">${product.kategori}</span></div>
          </div>

          ${isAkanTersedia ? `
            <div class="alert alert-warning" style="margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:0.75rem;padding:0.85rem 1rem;">
              <span class="alert-icon" style="font-size:1.25rem;">&#8987;</span>
              <div style="font-size:0.88rem;line-height:1.5;">
                <strong>Jadwal Ketersediaan / Panen:</strong> Produk ini diperkirakan siap pada <strong>${product.estimasiTersedia || 'waktu dekat'}</strong>. Anda dapat melakukan pemesanan awal (Pre-Order) lewat WhatsApp di bawah.
              </div>
            </div>` : ''}

          <div class="product-farmer-card" style="margin-bottom:1.25rem;">
            <div class="farmer-avatar"><img src="${UI.farmerImg(producer.namaUsaha, producer.foto)}" alt="${producer.namaUsaha}"></div>
            <div class="product-farmer-content">
              <strong>${producer.namaUsaha}</strong>
              <span>${producer.kategori} &middot; ${producer.alamat}</span>
            </div>
            <a href="produsen.html?id=${producer.id}" class="btn btn-outline">Lihat Profil</a>
          </div>

          <div class="product-detail-actions">
            ${isTersedia
              ? `<a href="${waLink}" target="_blank" rel="noopener" class="btn btn-primary btn-block">Hubungi via WhatsApp</a>`
              : (isAkanTersedia
                  ? `<a href="${waLink}" target="_blank" rel="noopener" class="btn btn-primary btn-block" style="background:#d97706;border-color:#d97706;">Pesan / Pre-Order via WhatsApp &rarr;</a>`
                  : `<button class="btn btn-outline btn-block" disabled>Stok sedang habis</button>`)}
          </div>
        </div>
      </div>`;
  }
})();
</script>
</body>
</html>
